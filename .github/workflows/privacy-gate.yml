name: privacy-gate

# Batería anti-fuga (defense-in-depth): re-corre el gate de privacidad en cada
# push/PR. La prevención primaria es el gate manual del flujo de mirror (repo
# privado); este workflow detecta fugas si el push ya ocurrió.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-audit:
    name: Anti-fuga de datos sensibles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Batería anti-fuga (IPs LAN, MACs, hostnames, contactos, archivos excluidos)
        run: |
          chmod +x scripts/privacy-audit.sh
          ./scripts/privacy-audit.sh .

      - name: Resumen
        if: always()
        run: |
          echo "### privacy-gate" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Cero coincidencias sensibles en el árbol tracked." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Coincidencias sensibles detectadas — revisar el log del step anterior." >> $GITHUB_STEP_SUMMARY
          fi
